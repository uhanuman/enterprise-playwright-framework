name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'dev' || 'qa' }}
      OUTPUT_DIR: output
      LOG_LEVEL: info
      REDACT_SECRETS: 'true'
      WORKERS: 4
      ENABLE_AI: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint / typecheck
        run: npm run lint

      - name: Security scan
        run: npm run security:scan

      - name: Run tests
        run: npx playwright test --workers=$WORKERS

      - name: Run BDD tests
        run: npm run test:bdd

      - name: Quality gate
        run: npm run quality:gate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-output
          path: output/
          retention-days: 14